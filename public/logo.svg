<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="delima-logo-title">
  <title id="delima-logo-title">Delima Realtors</title>
  <!-- Evergreen rounded-square field (#0C3B2E brand) -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0C3B2E"/>
  <!-- Rising sun accent (#E8A33D sun) -->
  <circle cx="49.5" cy="16.5" r="3.4" fill="#E8A33D"/>
  <!-- Amber roofline house mark -->
  <path d="M16.5 43.5 V27.5 L32 15.5 L47.5 27.5 V43.5"
        fill="none" stroke="#E8A33D" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Door -->
  <rect x="28.75" y="33" width="6.5" height="10.5" rx="2" fill="#E8A33D"/>
</svg>
