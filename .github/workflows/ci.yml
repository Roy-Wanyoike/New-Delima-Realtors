name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: svelte-check + build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # The app is designed to run in offline mode when these are absent
      # (src/lib/supabase.ts guards on missing env), so CI can build without
      # real Supabase credentials.
      VITE_SUPABASE_URL: ''
      VITE_SUPABASE_ANON_KEY: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type-check (svelte-check)
        run: yarn check

      - name: Build
        run: yarn build
